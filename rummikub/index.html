<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rummikub Online</title>
<style>

.hero{text-align:center;padding:30px 0 10px}
.logo{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-bottom:14px}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.t{width:40px;height:56px;border-radius:8px;background:linear-gradient(#fffdf6,#eee3c7);box-shadow:0 3px 0 #b5a67d,0 5px 8px rgba(0,0,0,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;font:800 25px system-ui;cursor:default;user-select:none;transition:.12s;flex:none}

.c0{color:#d4282c}.c1{color:#1d5fc4}.c2{color:#e68600}.c3{color:#24201c}.c4{color:#8b3fd1}

.set small{position:absolute;top:-10px;right:8px;background:#0b1f1a;border-radius:8px;padding:1px 7px;font-size:11px}
.add{width:30px;height:56px;border-radius:8px;border:2px dashed rgba(255,255,255,.4);background:none;color:#fff;font-size:20px;cursor:pointer}
.empty{margin:auto;opacity:.55}

.mine .t,.set .t{touch-action:none;cursor:grab}
.ghost{position:fixed;z-index:99;pointer-events:none;transform:scale(1.12) rotate(4deg);box-shadow:0 10px 18px rgba(0,0,0,.5)}
.t.new{outline:3px solid #7dffa1;animation:glow 1.1s ease-in-out infinite}@keyframes glow{50%{box-shadow:0 0 18px 4px #7dffa1}}

.t em{font:700 12px system-ui;font-style:normal;margin-top:-1px}
.tm{font-weight:700;margin-left:8px}
@media(max-width:640px){.home{grid-template-columns:1fr}.t{width:34px;height:48px;font-size:21px}.big .t{width:38px;height:54px;font-size:25px}}

<style>
.bg-home{position:fixed;left:12px;bottom:12px;z-index:2147483647;display:inline-flex;align-items:center;padding:8px 12px;border-radius:999px;background:rgba(15,18,32,.82);color:#fff;text-decoration:none;font:600 13px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;border:1px solid rgba(255,255,255,.18);box-shadow:0 6px 18px rgba(0,0,0,.28);backdrop-filter:blur(6px)}

<script>
// ====== CẤU HÌNH ======  (đổi nếu Realtime Database của bạn có URL khác)
const DB='https://sequence-23c7f-default-rtdb.asia-southeast1.firebasedatabase.app',B=DB+'/rummikub/rooms/';
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let me=localStorage.rkid||(localStorage.rkid=Math.random().toString(36).slice(2,10)),name=localStorage.rkname||'',room=localStorage.rkroom||'',V='home',R=null,G=null,W=null,S=[],M='',es=null,L=0,RK=[],RKk=null,DG=null,JD=0,LS='',HL=[],RT=0,HM=0;const TTL=30*60000;
const api=(p,m='GET',b)=>fetch(B+p+'.json',{method:m,body:b===undefined?undefined:JSON.stringify(b)}).then(r=>r.json());
const jt=i=>i<104?-1:i<106?0:i<108?1:i<110?2:3;
const hv=a=>a.reduce((x,i)=>x+(i>103?(jt(i)==3?0:30):i%13+1),0);
const TLS=[[0,'Không giới hạn'],[30,'30 giây'],[60,'60 giây'],[90,'90 giây'],[120,'2 phút'],[180,'3 phút']];
const tlOpts=v=>TLS.map(([x,l])=>`<option value="${x}" ${(v||0)==x?'selected':''}>${l}</option>`).join('');
const tlSel=h=>h?`<div class="row" style="justify-content:center"><span>⏱ Thời gian mỗi lượt</span><select onchange="setTL(this.value)" class="sel">${tlOpts(R.tl)}</select></div>`:`<p>⏱ Mỗi lượt: ${(TLS.find(x=>x[0]==(R.tl||0))||TLS[0])[1]}</p>`;
const modeSel=()=>`<p>🎮 Chế độ: ${R.mode==2?'🌀 Twist (joker đặc biệt)':'Chuẩn'}</p>`;
function setMode(v){R.mode=+v;api(room,'PATCH',{mode:+v,t:Date.now()})}
function setTL(v){R.tl=+v;api(room,'PATCH',{tl:+v,t:Date.now()})}
const col=i=>i>103?4:(i%52)/13|0,num=i=>i%13+1;
const JN=['Joker','Joker đôi (thay 2 quân)','Joker đổi màu','Joker gương'],JG=['☻','☻☻','🎨','🪞'];
const T=(i,x='',v)=>`<div class="t c${col(i)} ${S.includes(i)?'sel':''} ${HL.includes(i)?'new':''} jk${jt(i)} ${x}" data-i="${i}"${i>103?` title="${JN[jt(i)]}"`:''}>${i>103?JG[jt(i)]+(v?`<em>${v}</em>`:''):num(i)}<b></b></div>`;
const k=s=>s.slice().sort((a,b)=>a-b).join();
function runPts(ns,j1,j2,N){const gs=[];for(let k=1;k<ns.length;k++)if(ns[k]-ns[k-1]>1)gs.push(ns[k]-ns[k-1]-1);
 const lo=ns[0],hi=ns[ns.length-1];let best=0;
 const ends=(a,b)=>{for(let a1=0;a1<=a;a1++)for(let b1=0;b1<=b;b1++){const ll=a1+2*b1,rr=a-a1+2*(b-b1);if(ll<=lo-1&&rr<=13-hi)best=Math.max(best,(lo-ll+hi+rr)*N/2)}};
 const fg=(k,a,b)=>{if(k==gs.length)return ends(a,b);for(let y=0;y<=b&&2*y<=gs[k];y++){const x=gs[k]-2*y;if(x<=a)fg(k+1,a-x,b-y)}};
 fg(0,j1,j2);return best}
function ccrun(s){if(s.filter(i=>jt(i)==2).length!=1)return 0;const sl=[];let c=-1;
 s.forEach(i=>{if(i<104)sl.push(i);else{if(jt(i)==2)c=sl.length;for(let k=0;k<(jt(i)==1?2:1);k++)sl.push(-1)}});
 const N=sl.length;if(N>13)return 0;let a=null;
 for(let k=0;k<N;k++)if(sl[k]>=0){const v=num(sl[k])-k;if(a===null)a=v;else if(a!=v)return 0}
 if(a===null||a<1||a+N-1>13)return 0;const A=new Set(),B=new Set();sl.forEach((t,k)=>{if(t>=0)(k<c?A:B).add(col(t))});
 if(A.size>1||B.size>1||(A.size&&B.size&&[...A][0]==[...B][0]))return 0;return(2*a+N-1)*N/2}
function mir(s){if(s.filter(i=>jt(i)==3).length!=1||s.some(i=>jt(i)==1||jt(i)==2))return 0;
 const m=s.findIndex(i=>jt(i)==3),l=s.slice(0,m),q=s.slice(m+1).reverse();if(!l.length||l.length!=q.length)return 0;const L=[];
 for(let k=0;k<l.length;k++){const a=l[k],b=q[k];if(a<104&&b<104){if(a%52!=b%52)return 0;L.push(a)}else if(a<104)L.push(a);else if(b<104)L.push(b);else return 0}
 const ns=L.map(num),cs=L.map(col);let ok=false;
 if(ns.every(x=>x==ns[0])&&new Set(cs).size==L.length)ok=true;
 else if(new Set(cs).size==1){const d=ns[1]-ns[0];ok=(d==1||d==-1)&&ns.every((x,k)=>x==ns[0]+d*k)}
 return ok?2*ns.reduce((x,y)=>x+y,0):0}
function pts(s){const L=s.length;if(L<3)return 0;if(s.some(i=>jt(i)==3))return mir(s);if(s.some(i=>jt(i)==2))return ccrun(s);
 const f=s.filter(i=>i<104),j1=s.filter(i=>jt(i)==0).length,j2=s.filter(i=>jt(i)==1).length;if(!f.length)return 0;
 const N=f.length+j1+2*j2,ns=f.map(num),cs=f.map(col);
 if(N<=4&&ns.every(n=>n==ns[0])&&new Set(cs).size==cs.length)return ns[0]*N;
 if(new Set(cs).size!=1||new Set(ns).size!=ns.length||N>13)return 0;
 return runPts(ns.sort((x,y)=>x-y),j1,j2,N)}
const arr=s=>{if(s.some(i=>jt(i)>=2))return s;const f=s.filter(i=>i<104).sort((a,b)=>num(a)-num(b)||col(a)-col(b)),J=s.filter(i=>i>103);
 if(f.length&&J.length&&J.every(i=>jt(i)==0)&&new Set(f.map(col)).size==1&&new Set(f.map(num)).size==f.length){let lo=num(f[0]),hi=num(f[f.length-1]);const j=J.slice(),o=[];
  for(let n=lo;n<=hi;n++){const t=f.find(i=>num(i)==n);o.push(t!=null?t:j.shift())}
  if(!o.includes(undefined)){while(j.length){if(hi<13){o.push(j.shift());hi++}else{o.unshift(j.shift());lo--}}return o}}
 return f.concat(J)};
function jv(s){const o={};if(s.some(i=>jt(i)>0)||!pts(s)||!s.some(i=>i>103))return o;const f=s.filter(i=>i<104);if(f.length<2)return o;
 if(f.every(i=>num(i)==num(f[0]))){s.forEach((i,k)=>{if(i>103)o[k]=num(f[0])});return o}
 const k0=s.findIndex(i=>i<104),st=num(s[k0])-k0;if(s.every((i,k)=>i>103||num(i)==st+k))s.forEach((i,k)=>{if(i>103)o[k]=st+k});return o}
const myTurn=()=>G&&!G.w&&G.o[G.t]==me;
const nm=id=>esc((R&&R.p&&R.p[id])||'?');
function msg(t){M=t;render()}

/* ---------- phòng ---------- */
async function create(md){name=$('#nm').value.trim();if(!name)return msg('Nhập tên của bạn trước nhé');localStorage.rkname=name;md=+md||0;
 const c=Math.random().toString(36).slice(2,6).toUpperCase();
 try{await api(c,'PUT',{h:me,s:'lobby',t:Date.now(),mode:md,p:{[me]:name}});cleanup();enter(c)}catch(e){msg('Không kết nối được máy chủ (kiểm tra Firebase)')}}
async function join(md){name=$('#nm').value.trim();if(!name)return msg('Nhập tên của bạn trước nhé');localStorage.rkname=name;md=+md||0;
 const c=$(`#cd-${md}`).value.trim().toUpperCase();
 try{const r=await api(c);if(!r)return msg('Không tìm thấy phòng '+c);
   if((r.mode||0)!==md)return msg('Phòng này thuộc chế độ '+(r.mode==2?'Twist':'Chuẩn')+' — hãy sang tab tương ứng');
  if(!r.p[me]){if(r.g)return msg('Phòng đã bắt đầu chơi');if(Object.keys(r.p).length>=4)return msg('Phòng đã đủ 4 người');await api(c+'/p/'+me,'PUT',name);api(c,'PATCH',{t:Date.now()})}
  enter(c)}catch(e){msg('Không kết nối được máy chủ')}}
function enter(c){LS='';room=c;localStorage.rkroom=c;V='game';M='';if(es)es.close();
 es=new EventSource(B+c+'.json');['put','patch'].forEach(t=>es.addEventListener(t,pull));pull()}
async function pull(){if(!room||L)return;let r;try{r=await api(room)}catch(e){return}
 if(!r){M='Phòng không còn tồn tại';return leave()}if(Date.now()-(r.t||0)>TTL){api(room,'DELETE');M='Phòng đã tự xoá vì không hoạt động quá 30 phút';return leave()}const og=G;R=r;G=r.g?JSON.parse(r.g):null;if(og&&G&&og.k==G.k&&G.v>og.v&&og.o[og.t]!=me){const pr=new Set(og.tb.flat());HL=G.tb.flat().filter(i=>!pr.has(i))}
 if(G&&!G.h[me]){M='Ván này đã bắt đầu, bạn không có trong phòng';return leave()}
 const sig=JSON.stringify(r);if(sig==LS||(DG&&DG.on))return;LS=sig;setup();render()}
const mkW=()=>({v:G.v,k:G.k,rack:G.h[me].slice(),tb:G.tb.map(s=>s.slice()),orig:G.h[me].slice()});
function setup(){if(G&&myTurn()&&(!W||W.v!=G.v||W.k!=G.k)){W=mkW();S=[]}}
function leave(){if(es)es.close();if(!L&&R&&!R.g&&room){if(R.h==me)api(room,'DELETE');else api(room+'/p/'+me,'DELETE')}if(!L)localStorage.rkroom='';L=0;LS='';room='';R=G=W=null;S=[];V='home';render()}
function mkGame(ids,pv,tl,md){ids=ids.slice().sort(()=>Math.random()-.5);const d=[...Array(md==2?112:106).keys()].sort(()=>Math.random()-.5);const h={};ids.forEach(i=>h[i]=d.splice(0,14));
 if(pv&&(pv.mode||0)!=(md||0))pv=null;const sc={};ids.forEach(i=>sc[i]=(pv&&pv.sc&&pv.sc[i])||0);
 return {o:ids,h,pool:d,tb:[],m:{},t:0,v:1,k:Date.now(),w:null,log:'Ván mới bắt đầu!',sc,r:(pv&&pv.r||0)+1,mode:md||0,tl:tl||0,dl:tl?Date.now()+tl*1000:0}}
async function start(){const g=mkGame(Object.keys(R.p),G,R.tl,R.mode);HL=[];if(L){G=g;W=null;tick()}else await api(room,'PATCH',{g:JSON.stringify(g),s:'play',t:Date.now()})}
function bot(md){name=$('#nm').value.trim();if(!name)return msg('Nhập tên của bạn trước nhé');localStorage.rkname=name;md=+md||0;
 if(es)es.close();L=1;G=null;room='MAY';V='game';M='';R={h:me,s:'play',mode:md,tl:+$('#tl2-'+md).value,p:{[me]:name}};for(let i=1;i<=+$('#nb-'+md).value;i++)R.p['b'+i]='🤖 Máy '+i;start()}
function tick(){S=[];setup();render();if(L&&G&&!G.w&&G.o[G.t]!=me)setTimeout(botMove,500)}
async function cleanup(){try{const ks=await fetch(B.slice(0,-1)+'.json?shallow=true').then(r=>r.json());for(const c in ks||{}){const t=await api(c+'/t');if(!t||Date.now()-t>TTL)api(c,'DELETE')}}catch(e){}}
/* ---------- máy chơi ---------- */
function bestPlace(hand,need){const cnt=Array(52).fill(0);hand.forEach(i=>{if(i<104)cnt[i%52]++});const C=[];
 for(let c=0;c<4;c++)for(let a=0;a<13;a++){let b=a;while(b<13&&cnt[c*13+b])b++;for(let e=a+2;e<b;e++){const s=[];for(let x=a;x<=e;x++)s.push(c*13+x);C.push({s,p:(a+e+2)*(e-a+1)/2})}}
 for(let n=0;n<13;n++){const cs=[0,1,2,3].filter(c=>cnt[c*13+n]);if(cs.length>=3){const al=[cs];if(cs.length==4)cs.forEach(o=>al.push(cs.filter(c=>c!=o)));al.forEach(g=>C.push({s:g.map(c=>c*13+n),p:(n+1)*g.length}))}}
 let best=[],bs=0,nodes=0;
 const go=(i,cur,pl,sum)=>{if(sum>=need&&pl>bs){bs=pl;best=cur.slice()}if(++nodes>20000)return;
  for(let j=i;j<C.length;j++){const c=C[j];if(c.s.every(t=>cnt[t]>0)){c.s.forEach(t=>cnt[t]--);cur.push(c);go(j,cur,pl+c.s.length,sum+c.p);cur.pop();c.s.forEach(t=>cnt[t]++)}}};
 go(0,[],0,0);const pool=hand.slice();
 return best.map(c=>c.s.map(t=>{const x=pool.find(i=>i<104&&i%52==t);pool.splice(pool.indexOf(x),1);return x}))}
function botMove(){if(!L||!G||G.w)return;const id=G.o[G.t];if(id==me)return;HL=[];
 const h=G.h[id].slice(),tb=G.tb.map(q=>q.slice()),md=G.m[id],st=[],snap=(hl,txt)=>st.push({tb:tb.map(q=>q.slice()),h:h.slice(),hl,txt});
 for(const q of bestPlace(h,md?0:30)){tb.push(q);q.forEach(i=>h.splice(h.indexOf(i),1));snap(q.slice(),`đặt nhóm mới ${q.length} quân`)}
 if(md){let ch=1;while(ch){ch=0;for(const t of h.slice()){if(t>103&&h.length>1)continue;for(let x=0;x<tb.length;x++){const q=arr(tb[x].concat(t));if(pts(q)){tb[x]=q;h.splice(h.indexOf(t),1);snap([t],'nối thêm 1 quân vào một nhóm');ch=1;break}}}}}
 G.log=`${R.p[id]} đang suy nghĩ…`;render();let i=0;
 const go=()=>{if(!L||!G||G.w||G.o[G.t]!=id)return;
  if(i<st.length){const q=st[i++];G.tb=q.tb;G.h[id]=q.h;HL=q.hl.slice();G.log=`${R.p[id]} ${q.txt}`;render();return setTimeout(go,1100)}
  if(!st.length){G.log=`${R.p[id]} không đi được → rút bài`;render();return setTimeout(()=>pass(id),1000)}
  const n=st.reduce((a,q)=>a+q.hl.length,0);HL=[].concat(...st.map(q=>q.hl));G.m[id]=1;G.ps=0;
  if(!h.length)finish(id,'Hết bài! Rummikub!');else nextTurn(`${R.p[id]} đặt ${n} quân`)};
 setTimeout(go,1200)}

function rm(ids){W.rack=W.rack.filter(i=>!ids.includes(i));W.tb=W.tb.map(s=>s.filter(i=>!ids.includes(i)))}
function act(a,x){M='';HL=[];
 if(a=='home'){V='home'}else if(a=='tab'){HM=+x||0;render();if(window.refreshRooms)window.refreshRooms();return}else if(a=='rules'){V='rules';RT=0}else if(a=='rulesT'){V='rules';RT=1}else if(a=='create')return create(x);else if(a=='bot')return bot(x);else if(a=='join')return join(x);else if(a=='leave')return leave();else if(a=='start')return start();
 else if(a=='copy'){navigator.clipboard&&navigator.clipboard.writeText(room);M='Đã chép mã phòng '+room}
 else if(a=='new'&&S.length){const s=S.slice();rm(s);W.tb.push(arr(s));W.tb=W.tb.filter(q=>q.length);S=[]}
 else if(a=='add'&&S.length){const s=S.slice(),n=+x;rm(s);W.tb[n].push(...s);W.tb=W.tb.filter(q=>q.length).map(arr);S=[]}
 else if(a=='ret'){const s=S.filter(i=>W.orig.includes(i));if(!s.length)M='Chỉ trả lại được quân bài của bạn, không lấy bài trên bàn về giá';else{rm(s);W.rack.push(...s);S=S.filter(i=>!s.includes(i))}}
 else if(a=='undo'){W=mkW();S=[]}
 else if(a=='s1'){W.rack.sort((p,q)=>(p>103)-(q>103)||num(p)-num(q)||col(p)-col(q));RK=W.rack.slice()}
 else if(a=='s2'){W.rack.sort((p,q)=>(p>103)-(q>103)||col(p)-col(q)||num(p)-num(q));RK=W.rack.slice()}
 else if(a=='end')return endTurn();else if(a=='draw')return draw();
 render()}

function nextTurn(txt){G.t=(G.t+1)%G.o.length;G.log=txt;G.dl=G.tl?Date.now()+G.tl*1000:0;push()}
function finish(w,txt){G.w=w;G.dl=0;G.rd={};let tot=0;G.o.forEach(i=>{if(i!=w){G.rd[i]=-hv(G.h[i]);tot+=hv(G.h[i])}});G.rd[w]=tot;G.o.forEach(i=>G.sc[i]=(G.sc[i]||0)+G.rd[i]);G.log=txt;push()}
function endTurn(){
 if(W.tb.some(s=>!pts(s)))return msg('Còn nhóm chưa hợp lệ (viền đỏ) — hãy sửa lại');
 const placed=W.orig.length-W.rack.length;if(placed<=0)return msg('Hãy đặt ít nhất 1 quân, hoặc bấm “Rút bài”');
 if(!G.m[me]){const ok=new Set(G.tb.map(k));let sum=0;
  for(const s of W.tb){if(ok.has(k(s)))continue;if(s.some(i=>!W.orig.includes(i)))return msg('Lần đầu chỉ được dùng bài của bạn, không đụng vào bài trên bàn');sum+=pts(s)}
  if(sum<30)return msg(`Lần đầu cần tổng ≥ 30 điểm (hiện có ${sum})`)}
 G.h[me]=W.rack;G.tb=W.tb;G.m[me]=1;G.ps=0;
 if(!W.rack.length)finish(me,'Hết bài! Rummikub!');else nextTurn(`${R.p[me]} đặt ${placed} quân`)}
function pass(id,to){const had=G.pool.length;if(had)G.h[id].push(G.pool.pop());G.ps=had?0:(G.ps||0)+1;
 if(G.ps>=G.o.length)return finish(G.o.slice().sort((a,b)=>hv(G.h[a])-hv(G.h[b]))[0],'Hết bài rút, không ai đi được — người ít điểm nhất thắng');
 nextTurn(`${R.p[id]} ${had?'rút 1 quân':'bỏ lượt (hết bài rút)'}${to?' (hết giờ)':''}`)}
function draw(){pass(me)}

<h3>Joker</h3><p>Joker thay cho bất kỳ quân nào trong nhóm. Mỗi nhóm có thể chứa joker, nhưng nhóm vẫn phải hợp lệ.</p>
<h3>Lượt chơi</h3><ul><li>Bạn có thể đặt quân từ giá của mình ra bàn, tạo nhóm mới hoặc thêm vào nhóm có sẵn.</li><li>Bạn được sắp xếp lại các nhóm trên bàn (tách, ghép, đổi chỗ) miễn là cuối lượt <b>mọi nhóm đều hợp lệ</b> và không quân nào trên bàn bị lấy về giá.</li><li>Không có gì để đặt? Bấm <b>Rút bài</b> (lấy 1 quân và hết lượt).</li></ul>
<h3>Lần đặt đầu tiên: ≥ 30 điểm</h3><p>Lần đầu, các nhóm bạn đặt ra phải có tổng điểm từ 30 trở lên (tính theo số trên quân; joker tính bằng quân nó thay), và chỉ dùng bài của mình, chưa được động vào bài trên bàn.</p>
<h3>Tính điểm</h3><p>Khi có người hết bài, mỗi người còn lại bị trừ điểm các quân còn trên giá (Joker tính 30 điểm) và người thắng được cộng tổng số điểm đó. Điểm cộng dồn qua các ván trong cùng một phòng. Nếu hết bài rút mà không ai đi được, người có ít điểm nhất thắng.</p><h3>Thời gian mỗi lượt</h3><p>Chủ phòng chọn thời gian mỗi lượt (hoặc không giới hạn). Hết giờ, bài bạn sắp dở bị huỷ, bạn rút 1 quân và đến lượt người kế.</p><h3>Cách thao tác trên web</h3><ul><li><b>Kéo thả</b> quân bài: thả vào chỗ trống trên bàn để tạo nhóm mới, thả lên một quân để chèn vào nhóm đó, thả vào giá để sắp xếp.</li><li>Hoặc bấm vào quân để chọn (có thể chọn nhiều quân, kể cả quân trên bàn).</li><li><b>＋ Nhóm mới</b>: gom các quân đang chọn thành một nhóm mới.</li><li><b>＋</b> cạnh nhóm: thêm quân đang chọn vào nhóm đó.</li><li>Số nhỏ ở góc nhóm là điểm của nhóm; viền đỏ ✗ là nhóm chưa hợp lệ.</li><li><b>Hoàn tác</b> đưa mọi thứ về đầu lượt; <b>Kết thúc lượt</b> sẽ kiểm tra luật.</li></ul>
</div>${RT?twistRules():''}<div style="text-align:center;margin-top:20px"><button class="btn" onclick="V='${room?'game':'home'}';render()">Đã hiểu, chơi thôi!</button></div></div>`}
function ord(a){if(G&&RKk!=G.k){RK=[];RKk=G.k}const o=a.slice().sort((p,q)=>(RK.indexOf(p)+1||1e6)-(RK.indexOf(q)+1||1e6));RK=RK.concat(a.filter(i=>!RK.includes(i)));return o}
function target(el,x){if(!el)return null;const t=el.closest('.t[data-i]'),st=el.closest('.set'),rk=el.closest('.rack');
 if(t&&(st||rk)){const b=t.getBoundingClientRect();return {k:st?'set':'rack',ref:+t.dataset.i,after:x>b.left+b.width/2,el:st||rk}}
 if(st)return {k:'set',ref:null,key:+st.querySelector('.t').dataset.i,el:st};
 if(rk)return {k:'rack',ref:null,el:rk};const bd=el.closest('.board');return bd?{k:'board',el:bd}:null}
function drop(f){const tg=f.tg;if(!tg)return render();const mv=S.includes(f.id)&&S.length>1?S.slice():[f.id];
 if(tg.k=='rack'){if(mv.some(i=>!W.orig.includes(i)))return msg('Quân bài trên bàn không được lấy về giá');
  rm(mv);RK=RK.filter(i=>!mv.includes(i));const p=tg.ref!=null&&!mv.includes(tg.ref)?RK.indexOf(tg.ref)+(tg.after?1:0):RK.length;
  if(p<0)RK.push(...mv);else RK.splice(p,0,...mv);W.rack=W.rack.concat(mv)}
 else if(tg.k=='set'){const key=tg.ref!=null?tg.ref:tg.key,st=W.tb.find(q=>q.includes(key));if(!st)return render();const rest=st.filter(i=>!mv.includes(i));if(!rest.length)return render();
  let an,af;if(tg.ref!=null&&!mv.includes(tg.ref)){an=tg.ref;af=tg.after}else{an=rest[rest.length-1];af=true}
  rm(mv);const s2=W.tb.find(q=>q.includes(an));s2.splice(s2.indexOf(an)+(af?1:0),0,...mv);if(pts(s2))W.tb[W.tb.indexOf(s2)]=arr(s2)}
 else{rm(mv);W.tb.push(mv)}
 W.tb=W.tb.filter(q=>q.length);S=[];M='';render()}

document.addEventListener('pointerdown',e=>{if(e.button||!myTurn()||!W)return;const t=e.target.closest('.t[data-i]');if(!t||!t.closest('.mine,.set'))return;DG={id:+t.dataset.i,x:e.clientX,y:e.clientY,on:0,el:t}});

 DG.g.style.left=e.clientX-20+'px';DG.g.style.top=e.clientY-28+'px';DG.tg=target(document.elementFromPoint(e.clientX,e.clientY),e.clientX);hl()});
const endDrag=ok=>{const f=DG;if(!f)return;DG=null;if(!f.on)return;f.g.remove();hl();JD=Date.now();ok?drop(f):render()};
document.addEventListener('pointerup',()=>endDrag(1));document.addEventListener('pointercancel',()=>endDrag(0));
document.addEventListener('click',e=>{if(Date.now()-JD<250)return;const t=e.target.closest('.t[data-i]');
 if(t&&t.closest('.mine,.set')&&myTurn()){tog(+t.dataset.i);return}
 const a=e.target.closest('[data-a]');if(a&&!['leaveRules'].includes(a.dataset.a))act(a.dataset.a,a.dataset.k)});

 if(el){el.textContent='⏱ '+Math.max(left,0)+'s';el.style.color=left<=10?'#ff8a8a':''}
 const cur=G.o[G.t];if(XV==G.v||(DG&&DG.on))return;
 if(left<=0&&cur==me||(!L&&left<=-4)){XV=G.v;S=[];pass(cur,1)}},500);
setInterval(()=>{if(room&&V!='rules')pull()},4000);
cleanup();if(room)enter(room);else render();

<script>
/* Danh sách phòng đang chờ — đọc từ RTDB, tách theo chế độ. */
(function(){
  const nameOf=r=>(r&&r.p&&r.p[r.h])||'Ẩn danh';
  async function refresh(){
    let data=null;
    try{data=await fetch(B+'.json').then(x=>x.json())}catch(e){}
    [0,2].forEach(m=>{
      const el=document.getElementById('openRooms-'+m); if(!el)return;
      const label=m===2?'Twist':'Chuẩn';
      if(!data){el.textContent='Không tải được danh sách phòng (kiểm tra Firebase).';return}
      const rooms=Object.keys(data).filter(c=>{
        const r=data[c];
        return r && (Date.now()-(r.t||0))<TTL && r.s!=='play' && (r.mode||0)===m;
      }).slice(0,20);
      if(!rooms.length){el.textContent='Chưa có phòng '+label+' nào đang chờ. Bấm “Tạo phòng” để bắt đầu nhé.';return}
      el.innerHTML=rooms.map(c=>{
        const r=data[c],n=Object.keys(r.p||{}).length;
        return `<button class="btn g s" data-room="${esc(c)}" style="margin:4px 4px 0 0">${esc(c)} · ${esc(nameOf(r))} · ${n}/4</button>`;
      }).join('');
      el.querySelectorAll('[data-room]').forEach(b=>b.addEventListener('click',()=>{
        const nm=document.getElementById('nm');
        if(!nm||!nm.value.trim()){M='Nhập tên của bạn trước nhé';render();if(nm)nm.focus();return}
        const cd=document.getElementById('cd-'+m);if(cd)cd.value=b.dataset.room;
        join(m);
      }));
    });
  }
  window.refreshRooms=refresh;
  setInterval(()=>{if(V==='home')refresh()},10000);
  refresh();
})();
</script></body></html>
