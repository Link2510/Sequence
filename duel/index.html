<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="The Lord of the Rings: Duel for Middle-Earth — playable web adaptation, 69 chapter cards, 3 chapters, AI opponent, bilingual VI/EN, fully local.">
  <title>Duel for Middle-Earth</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body><a class="bg-home" href="https://boardgameace.web.app/" title="Về sảnh trò chơi" aria-label="Về sảnh trò chơi">← Sảnh trò chơi</a>
<style>
.bg-home{position:fixed;left:12px;bottom:12px;z-index:2147483647;display:inline-flex;align-items:center;padding:8px 12px;border-radius:999px;background:rgba(15,18,32,.82);color:#fff;text-decoration:none;font:600 13px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;border:1px solid rgba(255,255,255,.18);box-shadow:0 6px 18px rgba(0,0,0,.28);backdrop-filter:blur(6px)}
.bg-home:hover,.bg-home:focus-visible{background:#242b55;color:#ffcc4d;outline:none}
@media (prefers-color-scheme:light){.bg-home{background:rgba(255,255,255,.9);color:#1c2040;border-color:rgba(0,0,0,.15)}.bg-home:hover,.bg-home:focus-visible{color:#d98a00}}
</style>

  <div id="app">
    <header id="topbar">
      <div class="brand">
        <span class="brand-mark">⚔</span>
        <div>
          <div id="brandTitle">Duel for Middle-Earth</div>
          <div id="brandSubtitle" class="brand-sub">The Lord of the Rings · Trò chơi đối đầu 2 người</div>
        </div>
      </div>
      <div class="top-actions">
        <button id="langBtn" class="btn btn-ghost" type="button">EN</button>
        <button id="tutorialBtn" class="btn btn-ghost" type="button">Hướng dẫn từng bước</button>
        <button id="guideToggleBtn" class="btn btn-ghost" type="button">Ẩn hướng dẫn</button>
        <button id="guideBtn" class="btn btn-ghost" type="button">Luật chơi</button>
        <button id="homeBtn" class="btn btn-ghost" type="button">Trang chủ</button>
      </div>
    </header>

    <main id="main">
      <section id="chapterBar" class="bar">
        <div><span id="chapterLabel">Chương 1 / 3</span> · <span id="turnLabel"></span></div>
        <div id="scoreLine"></div>
      </section>

      <div id="boardGrid">
        <section id="stepGuide" class="panel wide-panel">
          <div class="panel-head"><span id="stepGuideLabel">Hướng dẫn từng bước</span><span class="gold">✦</span></div>
          <ol id="stepList"></ol>
        </section>

        <section id="questPanel" class="panel">
          <div class="panel-head"><span id="questLabel">Hành trình Nhẫn</span><span class="gold">✦</span></div>
          <div id="questTrack"></div>
        </section>

        <section id="regionPanel" class="panel">
          <div class="panel-head"><span id="regionLabel">Bản đồ 7 vùng</span><span class="gold">✦</span></div>
          <div id="regionBoard"></div>
        </section>

        <section id="playerPanel" class="panel">
          <div class="panel-head"><span id="youLabel">Bạn</span><span class="gold">✦</span></div>
          <div id="playerStats" class="stats"></div>
          <div class="sub-label" id="playedLabel">Bài đã chơi</div>
          <div id="playedCards" class="played-cards"></div>
        </section>

        <section id="foePanel" class="panel">
          <div class="panel-head"><span id="foeLabel">Đối thủ</span><span class="gold">✦</span></div>
          <div id="foeStats" class="stats"></div>
        </section>

        <section id="displayArea" class="panel wide-panel">
          <div class="panel-head"><span id="displayLabel">Khu vực bài chương</span><span id="deckCount"></span></div>
          <div id="displayCards"></div>
        </section>

        <section id="landmarkArea" class="panel wide-panel">
          <div class="panel-head"><span id="landmarkLabel">Điểm đến</span><span id="landmarkCount"></span></div>
          <div id="landmarkCards"></div>
        </section>

        <section id="logPanel" class="panel wide-panel">
          <div class="panel-head"><span id="logLabel">Nhật ký</span><span class="gold">✦</span></div>
          <div id="logList"></div>
        </section>
      </div>
    </main>
  </div>

  <div id="overlayRoot"></div>
  <div id="coachRoot"></div>

  <script src="js/cards.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/net.js"></script>
  <script src="js/room-list.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
