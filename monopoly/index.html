<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monopoly Việt Nam</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body><a class="bg-home" href="https://boardgameace.web.app/" title="Về sảnh trò chơi" aria-label="Về sảnh trò chơi">← Sảnh trò chơi</a>
<style>
.bg-home{position:fixed;left:12px;bottom:12px;z-index:2147483647;display:inline-flex;align-items:center;padding:8px 12px;border-radius:999px;background:rgba(15,18,32,.82);color:#fff;text-decoration:none;font:600 13px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;border:1px solid rgba(255,255,255,.18);box-shadow:0 6px 18px rgba(0,0,0,.28);backdrop-filter:blur(6px)}
.bg-home:hover,.bg-home:focus-visible{background:#242b55;color:#ffcc4d;outline:none}
@media (prefers-color-scheme:light){.bg-home{background:rgba(255,255,255,.9);color:#1c2040;border-color:rgba(0,0,0,.15)}.bg-home:hover,.bg-home:focus-visible{color:#d98a00}}
</style>

<div id="app">
  <header id="topbar">
    <div class="brand"><span class="mark">🎩</span><div><div id="brandTitle">MONOPOLY</div><div class="sub">Phiên bản Việt Nam · Bàn cờ cổ điển</div></div></div>
    <div class="top-actions">
      <button id="guideBtn" class="btn" type="button">Luật chơi</button>
      <button id="homeBtn" class="btn" type="button">Về sảnh trò chơi</button>
    </div>
  </header>
  <main id="main">
    <div id="playLayout">
      <section id="boardPanel" class="panel">
        <div id="board"></div>
      </section>
      <aside id="sidePanel">
        <section id="centerPanel" class="panel">
          <div class="panel-head"><span id="phaseLabel">Đang chờ</span><span id="turnLabel"></span></div>
          <div id="diceBox"><div class="die" id="die1">–</div><div class="die" id="die2">–</div><div id="diceSum"></div></div>
          <div id="actionBox"></div>
          <div id="detailBox"></div>
        </section>
        <section id="playersPanel" class="panel">
          <div class="panel-head"><span>Người chơi</span><span id="roundLabel"></span></div>
          <div id="playerList"></div>
        </section>
        <section id="logPanel" class="panel">
          <div class="panel-head"><span>Nhật ký</span></div>
          <div id="logList"></div>
        </section>
      </aside>
    </div>
  </main>
</div>
<div id="overlayRoot"></div>
<script src="js/board.js"></script>
<script src="js/cards.js"></script>
<script src="js/engine.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/net.js"></script>
<script src="js/room-list.js"></script>
<script src="js/game.js"></script>
</body>
</html>
